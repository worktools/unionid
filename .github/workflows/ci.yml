name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Daily feedback is intentionally Ubuntu-only. Full Ubuntu/macOS acceptance,
# evaluator smoke runs, examples, and packaging belong to release.yml.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Root crate: formatting, lint (default and asynchronous features), tests, and
  # the repository-owned consumer verification scripts.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Check the contributor's exact commit instead of GitHub's synthetic
          # pull-request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features asynchronous -- -D warnings
      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --features asynchronous --test asynchronous --test async_client
      - name: Verify repository consumers and deployment scripts
        run: |
          python3 scripts/verify-query-bindings.py
          python3 scripts/verify-typed-application.py
          python3 scripts/verify-envoy-deployment.py
          bash -n deploy/envoy/generate-dev-certs.sh
          bash -n deploy/envoy/verify.sh

  # Each standalone evaluation tool has its own workspace and lockfile; run them
  # as a matrix so they compile in parallel instead of serially.
  tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - storage-eval
          - recovery-eval
          - workload-eval
          - service-load-eval
          - churn-eval
          - compaction-eval
          - incremental-backup-eval
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: tools-${{ matrix.tool }}
          workspaces: |
            tools/${{ matrix.tool }} -> target
      - name: Check ${{ matrix.tool }}
        run: |
          cargo fmt --check --manifest-path tools/${{ matrix.tool }}/Cargo.toml
          cargo clippy --locked --manifest-path tools/${{ matrix.tool }}/Cargo.toml --all-targets -- -D warnings

  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: derive
          workspaces: |
            derive -> target
      - name: Check derive crate
        run: |
          cargo fmt --check --manifest-path derive/Cargo.toml
          cargo clippy --locked --manifest-path derive/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path derive/Cargo.toml

  query-macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: query-macro
          workspaces: |
            query-macro -> target
      - name: Check inline query macro crate
        run: |
          cargo fmt --check --manifest-path query-macro/Cargo.toml
          cargo clippy --locked --manifest-path query-macro/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path query-macro/Cargo.toml
