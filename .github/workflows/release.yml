name: Release

on:
  workflow_dispatch:
    inputs:
      run_large_backup_evaluator:
        description: Run the optional 10k/100k incremental-backup evaluator
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # This is the single pre-release gate for native platform behavior. Ordinary
  # pull requests and main pushes stay on the shorter Ubuntu-only CI workflow.
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            expected-target: x86_64-unknown-linux-gnu
          - os: macos-latest
            expected-target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Check core crate
        run: |
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features asynchronous -- -D warnings
          cargo test --locked
          cargo test --locked --features asynchronous --test asynchronous --test async_client
          python3 scripts/verify-query-bindings.py
          python3 scripts/verify-typed-application.py
          python3 scripts/verify-envoy-deployment.py
          bash -n deploy/envoy/generate-dev-certs.sh
          bash -n deploy/envoy/verify.sh
      - name: Verify Envoy mTLS controlled-network journey
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --bin unionid
          deploy/envoy/verify.sh target/debug/unionid
      - name: Check and exercise standalone evaluation tools
        shell: bash
        run: |
          for manifest in \
            tools/storage-eval/Cargo.toml \
            tools/recovery-eval/Cargo.toml \
            tools/workload-eval/Cargo.toml \
            tools/service-load-eval/Cargo.toml \
            tools/churn-eval/Cargo.toml \
            tools/compaction-eval/Cargo.toml \
            tools/incremental-backup-eval/Cargo.toml \
            tools/adt-interop-eval/Cargo.toml
          do
            cargo fmt --check --manifest-path "$manifest"
            cargo check --locked --manifest-path "$manifest"
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          done
          cargo run --locked --manifest-path tools/storage-eval/Cargo.toml -- redb "${RUNNER_TEMP}/unionid-redb.db" 5
          cargo run --locked --manifest-path tools/storage-eval/Cargo.toml -- sqlite "${RUNNER_TEMP}/unionid-sqlite.db" 5
          cargo run --release --locked --manifest-path tools/recovery-eval/Cargo.toml -- "${RUNNER_TEMP}/unionid-recovery.db" 100 50
          cargo run --release --locked --manifest-path tools/workload-eval/Cargo.toml -- "${RUNNER_TEMP}/unionid-workload.db" 100 5 50
          cargo run --release --locked --manifest-path tools/service-load-eval/Cargo.toml -- "${RUNNER_TEMP}/unionid-service-load" 100 12 --smoke
          cargo run --release --locked --manifest-path tools/churn-eval/Cargo.toml -- "${RUNNER_TEMP}/unionid-churn" 1100 3 20260910 100
          cp "${RUNNER_TEMP}/unionid-churn.redb" "${RUNNER_TEMP}/unionid-compact.redb"
          cargo run --release --locked --manifest-path tools/compaction-eval/Cargo.toml -- "${RUNNER_TEMP}/unionid-compact.redb"
          cargo run --release --locked --manifest-path tools/incremental-backup-eval/Cargo.toml -- "${RUNNER_TEMP}/unionid-incremental-backup-smoke" 100 5 50 > "${RUNNER_TEMP}/unionid-incremental-backup-smoke.json"
          cat "${RUNNER_TEMP}/unionid-incremental-backup-smoke.json"
          python3 scripts/verify-adt-interop-eval.py --rows 100 --samples 1
      - name: Run optional large incremental-backup evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.run_large_backup_evaluator
        shell: bash
        run: |
          cargo run --release --locked --manifest-path tools/incremental-backup-eval/Cargo.toml -- "${RUNNER_TEMP}/unionid-incremental-backup-10k" 10000 30 1000 > "${RUNNER_TEMP}/unionid-incremental-backup-10k.json"
          cargo run --release --locked --manifest-path tools/incremental-backup-eval/Cargo.toml -- "${RUNNER_TEMP}/unionid-incremental-backup-100k" 100000 30 3000 > "${RUNNER_TEMP}/unionid-incremental-backup-100k.json"
          cat "${RUNNER_TEMP}/unionid-incremental-backup-10k.json"
          cat "${RUNNER_TEMP}/unionid-incremental-backup-100k.json"
      - name: Check derive crate
        run: |
          cargo fmt --check --manifest-path derive/Cargo.toml
          cargo check --locked --manifest-path derive/Cargo.toml
          cargo clippy --locked --manifest-path derive/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path derive/Cargo.toml
      - name: Check inline query macro crate
        run: |
          cargo fmt --check --manifest-path query-macro/Cargo.toml
          cargo check --locked --manifest-path query-macro/Cargo.toml
          cargo clippy --locked --manifest-path query-macro/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path query-macro/Cargo.toml
      - name: Measure inline query macro consumer
        if: runner.os == 'Linux'
        run: python3 scripts/evaluate-query-macro.py --output "${RUNNER_TEMP}/unionid-query-macro-eval.json"
      - name: Exercise examples and current consumer
        run: |
          cargo run --locked -- run --file examples/tasks.unid
          cargo run --locked --example getting_started -- "${RUNNER_TEMP}/unionid-embedded.redb"
          cargo test --locked --example cold_content
          cargo run --locked --example cold_content -- "${RUNNER_TEMP}/unionid-cold-content.redb"
          cargo run --locked --example todolist -- "${RUNNER_TEMP}/unionid-todolist"
          python3 scripts/verify-current-consumer.py
      - name: Verify published v0.8 package compatibility
        shell: bash
        run: |
          archive="unionid-v0.8.0-${{ matrix.expected-target }}.tar.gz"
          base="https://github.com/worktools/unionid/releases/download/v0.8.0"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}.sha256" "${base}/${archive}.sha256"
          cargo build --locked --bin unionid
          python3 scripts/verify-previous-release-compatibility.py \
            --archive "${RUNNER_TEMP}/${archive}" \
            --checksum "${RUNNER_TEMP}/${archive}.sha256" \
            --current-binary target/debug/unionid \
            --previous-version 0.8.0 \
            --current-version 0.9.0 \
            --work-dir "${RUNNER_TEMP}/unionid-v080-compat"
      - name: Package native artifact
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--expect-version "${GITHUB_REF_NAME#v}")
          fi
          python3 scripts/package-release.py --output dist "${args[@]}"
      - name: Record archive digest outside the artifact
        id: release-digest
        shell: bash
        run: |
          digest="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(next(pathlib.Path(sys.argv[1]).glob("*.tar.gz")).read_bytes()).hexdigest())' dist)"
          echo "sha256=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Verify checksum, CLI and tutorial
        run: python3 scripts/verify-release.py --dist dist --expected-sha256 "${{ steps.release-digest.outputs.sha256 }}"
      - name: Record release-candidate acceptance
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("release/contract.json"))["software_version"])')"
          network_args=()
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            network_args+=(--controlled-network-journey)
          fi
          python3 scripts/record-release-acceptance.py \
            --dist dist \
            --expected-sha256 "${{ steps.release-digest.outputs.sha256 }}" \
            --expected-target "${{ matrix.expected-target }}" \
            --candidate "${{ github.sha }}" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --runner-os "${{ runner.os }}" \
            --runner-arch "${{ runner.arch }}" \
            "${network_args[@]}" \
            --output "${RUNNER_TEMP}/unionid-v${version}-acceptance.json"
      - uses: actions/upload-artifact@v7
        with:
          name: unionid-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*
            ${{ runner.temp }}/unionid-v*-acceptance.json
            ${{ runner.temp }}/unionid-incremental-backup-*.json
            ${{ runner.temp }}/unionid-query-macro-eval.json
          if-no-files-found: error

  crate-derive:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Verify crates.io package
        run: cargo publish --dry-run --locked --manifest-path derive/Cargo.toml --registry crates-io
      - name: Verify crates.io publication credential
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not available to this workflow"
            exit 1
          fi
      - name: Publish crate to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --locked --manifest-path derive/Cargo.toml --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  crate:
    needs: [build, crate-derive]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Verify crates.io package
        run: cargo publish --dry-run --locked --registry crates-io
      - name: Verify crates.io publication credential
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not available to this workflow"
            exit 1
          fi
      - name: Publish crate to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  crate-query:
    needs: [build, crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Verify unpublished package contents
        if: ${{ ! startsWith(github.ref, 'refs/tags/v') }}
        run: cargo package --list --locked --manifest-path query-macro/Cargo.toml
      - name: Verify crates.io package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for attempt in {1..6}; do
            if cargo publish --dry-run --locked --manifest-path query-macro/Cargo.toml --registry crates-io; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 20
            fi
          done
          exit 1
      - name: Verify crates.io publication credential
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not available to this workflow"
            exit 1
          fi
      - name: Publish crate to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --locked --manifest-path query-macro/Cargo.toml --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, crate-derive, crate, crate-query]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: unionid-*
          merge-multiple: true
          path: dist
      - name: Collect and verify release assets
        shell: bash
        run: |
          mkdir release-assets
          archive_count="$(find dist -type f -name '*.tar.gz' | wc -l)"
          checksum_count="$(find dist -type f -name '*.tar.gz.sha256' | wc -l)"

          if [[ "$archive_count" -ne 2 || "$checksum_count" -ne 2 ]]; then
            echo "::error::expected two native archives and two checksum files, found ${archive_count} archives and ${checksum_count} checksums"
            find dist -type f -print
            exit 1
          fi

          find dist -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -exec cp {} release-assets/ \;
          if [[ "$(find release-assets -type f | wc -l)" -ne 4 ]]; then
            echo "::error::release asset names are not unique"
            find release-assets -type f -print
            exit 1
          fi

          cd release-assets
          sha256sum --check --strict *.sha256
      - uses: softprops/action-gh-release@v3
        with:
          body_path: docs/RELEASE-${{ github.ref_name }}.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
