[package]
name = "unionid-adt-interop-eval"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt"] }
unionid = { path = "../.." }
