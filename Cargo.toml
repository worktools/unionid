[package]
name = "unionid"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A lightweight Rust database with algebraic data types and PRQL-style pipelines"
license = "MIT"
repository = "https://github.com/worktools/unionid"
homepage = "https://github.com/worktools/unionid"
documentation = "https://docs.rs/unionid"
keywords = ["database", "adt", "query-language", "redb", "cli"]
categories = ["database", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
redb = "=4.1.0"
rustyline = { version = "17.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
