[package]
name = "unionid"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "A lightweight Rust database with algebraic data types and PRQL-style pipelines"
license = "MIT"
repository = "https://github.com/worktools/unionid"
homepage = "https://github.com/worktools/unionid"
documentation = "https://docs.rs/unionid"
keywords = ["database", "adt", "query-language", "redb", "cli"]
categories = ["database", "command-line-utilities"]

[features]
default = []
asynchronous = ["dep:tokio", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time"]
http = ["asynchronous", "dep:axum", "dep:futures-core", "tokio/sync"]
http-client = ["asynchronous", "dep:reqwest"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
redb = "=4.1.0"
rustyline = { version = "17.0", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
imbl = { version = "7.0.1", features = ["serde"] }
tokio = { version = "1", features = ["rt"], optional = true }
axum = { version = "0.8", optional = true }
futures-core = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
axum = "0.8"
futures-core = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "asynchronous"
required-features = ["asynchronous"]

[[test]]
name = "async_client"
required-features = ["asynchronous"]

[[test]]
name = "http_adapter"
required-features = ["http"]

[[test]]
name = "http_client"
required-features = ["http", "http-client"]

[[test]]
name = "current-consumer"
required-features = ["http", "http-client"]

[[example]]
name = "http_service"
required-features = ["http"]
